[package]
name    = "sps-bench"
version = "0.1.0"
edition = "2021"

# Single binary — injects VoteTx frames over CometBFT's JSON-RPC endpoint
# (broadcast_tx_sync or broadcast_tx_async) for end-to-end ledger throughput.
[[bin]]
name = "sps-bench"
path = "sps-bench.rs"

[dependencies]
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
base64 = "0.22"
bincode = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }


[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
